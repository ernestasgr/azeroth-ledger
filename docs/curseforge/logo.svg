<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0" stop-color="#3a2a1a"/>
      <stop offset="1" stop-color="#140d07"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6dc8c"/>
      <stop offset="0.5" stop-color="#d4a640"/>
      <stop offset="1" stop-color="#9a6a1c"/>
    </linearGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7a2a1e"/>
      <stop offset="1" stop-color="#4a1610"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4e6c4"/>
      <stop offset="1" stop-color="#dcc79a"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" rx="72" fill="url(#bg)"/>
  <rect x="14" y="14" width="372" height="372" rx="60" fill="none" stroke="url(#gold)" stroke-width="6"/>

  <!-- Open ledger book -->
  <path d="M60 118 Q130 96 200 122 Q270 96 340 118 L340 300 Q270 280 200 304 Q130 280 60 300 Z" fill="url(#cover)" stroke="url(#gold)" stroke-width="6" stroke-linejoin="round"/>
  <path d="M74 122 Q136 104 196 128 L196 288 Q136 266 74 284 Z" fill="url(#page)"/>
  <path d="M204 128 Q264 104 326 122 L326 284 Q264 266 204 288 Z" fill="url(#page)"/>
  <line x1="200" y1="124" x2="200" y2="302" stroke="#9a6a1c" stroke-width="4"/>

  <!-- Ledger lines, left page -->
  <g stroke="#a88a5a" stroke-width="5" stroke-linecap="round">
    <path d="M96 150 Q140 138 178 152"/>
    <path d="M96 178 Q140 166 178 180"/>
    <path d="M96 206 Q140 194 178 208"/>
    <path d="M96 234 Q140 222 178 236"/>
  </g>

  <!-- Coin on the right page -->
  <circle cx="265" cy="196" r="44" fill="url(#gold)" stroke="#7a5214" stroke-width="5"/>
  <circle cx="265" cy="196" r="32" fill="none" stroke="#7a5214" stroke-width="3"/>
  <path d="M249 197 l11 12 l22 -26" fill="none" stroke="#5a3a0c" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Bookmark ribbon -->
  <path d="M296 118 L296 340 L310 326 L324 340 L324 112" fill="#b8322a" stroke="#6e1a14" stroke-width="3" stroke-linejoin="round"/>
</svg>
