name: Verify addon

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: leafo/gh-actions-lua@6919171ccf181b826f44b9bca76307b577217377 # v13
        with:
          luaVersion: "5.1.5"
      - uses: leafo/gh-actions-luarocks@35d062def313a7699a0d513e996bcf4352f05389 # v6
        with:
          luarocksVersion: "3.12.2"
      - name: Install pinned tools
        run: |
          luarocks install luacheck 1.2.0-1
          curl -fsSL -o stylua.zip https://github.com/JohnnyMorganz/StyLua/releases/download/v2.5.2/stylua-linux-x86_64.zip
          echo 'bcb0d855e91f102f28a370e850f8566b3b44b79e6274d806ea5246837c0fd5ab  stylua.zip' | sha256sum -c -
          mkdir -p .tools/stylua
          unzip -q stylua.zip -d .tools/stylua
          curl -fsSL -o luals.tar.gz https://github.com/LuaLS/lua-language-server/releases/download/3.19.1/lua-language-server-3.19.1-linux-x64.tar.gz
          echo 'e9235d2d72ef55bc41cf8c99cda2ed64777682024b4bb81f5dea425060c5cbb8  luals.tar.gz' | sha256sum -c -
          mkdir -p .tools/luals
          tar -xzf luals.tar.gz -C .tools/luals
      - name: Lua 5.1 syntax and behavior
        run: |
          find AzerothLedger AzerothLedger_Tests tests -name '*.lua' -print0 | xargs -0 -n1 luac -p
          lua tests/store_spec.lua
          lua tests/client_spec.lua
          lua tests/collection_spec.lua
          lua tests/book_query_spec.lua
          lua tests/book_ui_spec.lua
          lua tests/journal_spec.lua
          lua tests/reward_spec.lua
          lua tests/quest_event_spec.lua
          lua tests/quest_delayed_event_spec.lua
          lua tests/loot_event_spec.lua
          lua tests/scan_spec.lua
          lua tests/wowunit_replay_spec.lua
          lua tests/vendor_event_spec.lua
          lua tests/saved_variables_event_spec.lua
      - name: Format and lint
        run: |
          .tools/stylua/stylua --check AzerothLedger AzerothLedger_Tests tests
          luacheck AzerothLedger AzerothLedger_Tests tests
      - name: LuaLS diagnostics
        run: |
          status=0
          .tools/luals/bin/lua-language-server --check="${PWD}" --checklevel=Warning --check_format=json --check_out_path="${PWD}/check.json" --logpath="${PWD}" || status=$?
          python3 tools/check_luals.py
          exit "$status"
      - name: Package contents and order
        run: python3 tools/package.py --output dist/AzerothLedger.zip
      - name: Local installer behavior
        run: python3 -m unittest discover -s tests -p 'test_*.py'
